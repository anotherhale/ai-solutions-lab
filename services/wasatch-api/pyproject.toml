[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wasatch-api"
version = "0.1.0"
description = "Wasatch Business Systems laboratory API for synthetic records."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6,<0.122",
    "uvicorn[standard]>=0.32.1,<0.38",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14.0,<1.17",
    "psycopg[binary]>=3.2.3,<3.3",
    "pydantic>=2.10.3,<2.12",
    "pydantic-settings>=2.7.0,<2.10",
    # Official client for the OpenAI chat and embedding adapter. The default
    # provider is the in-process fake. Tests and CI do not need an API key.
    "openai>=3.45.0,<4",
    # Host traces. The API, SDK, and OTLP/HTTP exporter are wired from the
    # composition root. Export runs only when OTEL_EXPORTER_OTLP_ENDPOINT is
    # set. Pins are the 1.45.2 / 0.66b2 release pair.
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9",
    "httpx>=0.28.1,<0.29",
    "jsonschema>=4.23,<5",
    "ruff==0.17.3",
]

[project.scripts]
wasatch-api = "wasatch_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
